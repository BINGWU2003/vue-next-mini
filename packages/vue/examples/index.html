<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="../dist/index.iife.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      console.log(VueNextMini);
      const { reactive, effect } = VueNextMini;

      const state = reactive({
        name: 'John',
        age: 18,
      });
      // console.log(state.age);
      // state.age = 100;
      effect(() => {
        console.log('run', state);
        document.getElementById('app').innerText = `Name: ${state.name}, Age: ${state.age}`;
      });
      setTimeout(() => {
        state.age = 100;
        state.name = 'Mary';
      }, 2000);
    </script>
  </body>
</html>
