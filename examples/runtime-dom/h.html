<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="../../dist/index.iife.js"></script>
  </head>
  <body>
    <div id="app">
      <p id="p1"></p>
      <p id="p2"></p>
    </div>
    <script>
      console.log(VueNextMini);
      const { h } = VueNextMini;
      const vnode1 = h('div', { class: 'my-color' }, 'hello h function');
      console.log(vnode1);
      const vnode2 = h('div', { class: 'my-color' }, [
        h('p', { class: 'p-class' }, 'nested p tag'),
        h('span', { class: 'span-class' }, 'nested span tag'),
        h('a', { class: 'a-class' }, 'nested a tag'),
      ]);
      console.log(vnode2);
    </script>
  </body>
</html>
