<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="../../dist/index.iife.js"></script>
  </head>
  <body>
    <div id="app">
      <p id="p1"></p>
      <p id="p2"></p>
    </div>
    <script>
      console.log(VueNextMini);
      const { h, render } = VueNextMini;
      // 节点元素，文本内容和props变化
      const vnode1 = h(
        'div',
        {
          style: {
            color: 'red',
          },
          onClick: () => {
            alert('hello');
          },
        },
        'hello h function'
      );

      console.log(vnode1);
      render(vnode1, document.getElementById('p1'));
      // 类型从div变为input
      // textarea 的 value 属性需要特殊处理
      const vnode2 = h(
        'div',
        {
          style: {
            color: 'blue',
            backgroundColor: 'yellow',
          },
          // 更新事件处理函数
          // onClick: () => {
          //   alert('hello new');
          // },
          onDBlclick: () => {
            alert('blclick event');
          },
        },
        'hello h function new'
      );
      console.log(vnode2);
      setTimeout(() => {
        render(vnode2, document.getElementById('p1'));
      }, 2000);
    </script>
  </body>
</html>
